<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ML-Nav & Logistics · Consola de patio (prototipo)</title>
<style>
:root{
  --amarillo:#FFF159; --azul:#2D3277; --texto:#202644; --fondo:#F5F6F8; --card:#FFFFFF; --borde:#DDE0E8;
  --sec:#5F6578; --ter:#656B7F;
  --ok-bg:#EAF7EF; --ok:#137A44; --carga-bg:#EAF2FF; --carga:#2464B4; --asig-bg:#FFF7CC; --asig:#8B6A00; --bloq-bg:#FDEDEF; --bloq:#C03D47;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:Inter,"Segoe UI",system-ui,-apple-system,Arial,sans-serif;font-size:13px;color:var(--texto);background:var(--fondo);min-width:1180px}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--azul);outline-offset:2px}
h1{font-size:28px;margin:0 0 4px;font-weight:700}
h2{font-size:16px;margin:0;font-weight:600}
.sub{font-size:14px;color:var(--sec);margin:0 0 18px}
.sm{font-size:12px;color:var(--sec)}
.ter{font-size:12px;color:var(--ter)}
/* top bar */
.top{height:56px;background:var(--amarillo);display:flex;align-items:center;padding:0 24px;gap:18px;border-bottom:1px solid #E6D93F}
.logo{font-weight:800;font-size:20px;color:var(--azul);display:flex;align-items:center;gap:8px}
.logo small{display:block;font-size:12px;font-weight:500;color:var(--texto);line-height:1}
.top .ttl{font-size:12px;font-weight:700;letter-spacing:.04em;border-left:1px solid rgba(32,38,68,.3);padding-left:18px}
.top .sp{flex:1}
.top select{background:#fff;border:1px solid #D8CB33;border-radius:8px;padding:8px 12px;width:230px;flex:none}
.logo{white-space:nowrap;flex-shrink:0}.top .ttl{white-space:nowrap}.user{flex-shrink:0;white-space:nowrap}
.logo>div{line-height:1.05}
.icon-btn{background:transparent;border:0;cursor:pointer;font-size:18px;padding:6px 8px;border-radius:8px;position:relative}
.icon-btn:hover{background:rgba(0,0,0,.06)}
.dot{position:absolute;top:2px;right:2px;background:var(--bloq);color:#fff;border-radius:9px;font-size:12px;min-width:16px;height:16px;line-height:16px;text-align:center;font-weight:700}
.user{position:relative}
.user>button{background:transparent;border:0;cursor:pointer;text-align:left;padding:4px 8px;border-radius:8px}
.user>button:hover{background:rgba(0,0,0,.06)}
.user b{display:block;font-size:13px}.user span{font-size:12px}
.menu{position:absolute;right:0;top:46px;background:#fff;border:1px solid var(--borde);border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.12);min-width:200px;padding:6px;z-index:20}
.menu button{display:block;width:100%;text-align:left;background:none;border:0;padding:9px 10px;border-radius:8px;cursor:pointer}
.menu button:hover{background:var(--fondo)}
/* layout */
.shell{display:flex;min-height:calc(100vh - 56px)}
.side{width:200px;background:#fff;border-right:1px solid var(--borde);padding:18px 12px;display:flex;flex-direction:column;flex-shrink:0}
.side .cap{font-size:12px;font-weight:600;letter-spacing:.05em;color:var(--sec);margin:0 8px 8px}
.nav a{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:8px;color:var(--texto);text-decoration:none;margin-bottom:2px;border-left:3px solid transparent}
.nav a:hover{background:var(--fondo)}
.nav a.on{background:#E9EAF5;color:var(--azul);font-weight:600;border-left-color:var(--azul)}
.nav a.off{opacity:.55}
.nav svg,.ico{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.side .grow{flex:1}
.sync{background:var(--fondo);border-radius:8px;padding:10px;margin-bottom:12px;font-size:12px}
.sync b{color:var(--ok);display:block;font-weight:600}
.sync span{color:var(--ter)}
.helpbtn{background:none;border:0;display:flex;align-items:center;gap:8px;padding:8px;cursor:pointer;border-radius:8px;color:var(--texto)}
.helpbtn:hover{background:var(--fondo)}
.main{flex:1;padding:22px 32px 12px;min-width:0;display:flex;flex-direction:column}
.crumbs{font-size:12px;color:var(--sec);margin-bottom:10px}
.foot{display:flex;justify-content:space-between;font-size:12px;color:var(--ter);padding:20px 0 6px;margin-top:auto}
/* cards */
.card{background:var(--card);border-radius:12px;border:1px solid var(--borde);padding:18px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:16px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:16px}
.kpi{border-left:3px solid var(--azul)}
.kpi .l{font-size:12px;color:var(--sec)}
.kpi .v{font-size:32px;font-weight:700;line-height:1.2;color:var(--azul)}
.kpi.ok{border-left-color:var(--ok)}.kpi.ok .v{color:var(--ok)}
.kpi.carga{border-left-color:var(--carga)}.kpi.carga .v{color:var(--carga)}
.kpi.bloq{border-left-color:var(--bloq)}.kpi.bloq .v{color:var(--bloq)}
.kpi .d{font-size:12px;color:var(--ter)}
.row{display:flex;gap:16px}.col{flex:1;min-width:0}
.btn{border:1px solid var(--borde);background:#fff;border-radius:8px;padding:10px 16px;cursor:pointer;font-weight:600}
.btn:hover{background:var(--fondo)}
.btn.pri{background:var(--amarillo);border-color:#E2D43A;color:var(--texto);font-weight:700}
.btn.pri:hover{background:#FFE92E}
.btn.full{width:100%}
.btn:disabled{background:#E7E9EF;color:var(--ter);border-color:#E1E4EB;cursor:not-allowed}
.btn.danger{background:var(--bloq);color:#fff;border-color:var(--bloq)}
.btn.danger:hover{background:#A7323B}
.linkb{background:none;border:0;color:var(--azul);font-weight:600;cursor:pointer;padding:4px 2px;text-decoration:none}
.linkb:hover{text-decoration:underline}
.linkb.red{color:var(--bloq)}
label{display:block;font-size:12px;font-weight:600;margin:12px 0 4px;color:var(--texto)}
input[type=text],input[type=password],input[type=date],input[type=time],input[type=number],select,textarea{width:100%;border:1px solid #C9CDD8;border-radius:8px;padding:10px 12px;background:#fff}
input.err,select.err,textarea.err{border-color:var(--bloq);background:#fff}
.msg{font-size:12px;margin-top:4px}
.msg.ok{color:var(--ok)}.msg.err{color:var(--bloq)}
.banner{border-radius:8px;padding:12px 14px;margin-bottom:14px;font-size:13px;display:flex;gap:10px;align-items:flex-start}
.banner.err{background:var(--bloq-bg);color:var(--bloq);border:1px solid #F3C6CB}
.banner.ok{background:var(--ok-bg);color:var(--ok);border:1px solid #BFE5CF}
.banner.info{background:#E9EEFB;color:var(--azul);border:1px solid #CBD5F2}
.banner b{font-weight:700}
.pill{display:inline-block;border-radius:6px;padding:3px 9px;font-size:12px;font-weight:600}
.p-ok{background:var(--ok-bg);color:var(--ok)}.p-carga{background:var(--carga-bg);color:var(--carga)}.p-asig{background:var(--asig-bg);color:var(--asig)}.p-bloq{background:var(--bloq-bg);color:var(--bloq)}.p-gris{background:#ECEEF3;color:var(--sec)}
/* map */
.legend{display:flex;gap:14px;flex-wrap:wrap;margin:8px 0 6px}
.legend button{background:none;border:1px solid transparent;border-radius:16px;padding:4px 10px;cursor:pointer;font-size:12px;display:flex;align-items:center;gap:6px}
.legend button:hover{background:var(--fondo)}
.legend button.on{border-color:var(--azul);background:#E9EAF5}
.sw{width:9px;height:9px;border-radius:50%;display:inline-block}
.zone{font-size:12px;font-weight:700;color:var(--azul);margin:12px 0 6px}
.bays{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.bay{border:2px solid transparent;border-radius:8px;padding:8px 10px;text-align:left;cursor:pointer;line-height:1.3;background:#fff}
.bay b{display:block;font-size:14px}.bay span{font-size:12px}
.bay.disp{background:var(--ok-bg);color:var(--ok)}.bay.carga{background:var(--carga-bg);color:var(--carga)}.bay.asig{background:var(--asig-bg);color:var(--asig)}.bay.bloq{background:var(--bloq-bg);color:var(--bloq)}
.bay.sel{border-color:var(--azul);box-shadow:0 0 0 2px #fff inset}
.bay.dim{opacity:.28}
dl.kv{display:grid;grid-template-columns:110px 1fr;gap:9px 8px;margin:12px 0;border-top:1px solid var(--borde);padding-top:12px}
dl.kv dt{color:var(--sec)}dl.kv dd{margin:0;font-weight:600}
.prog{height:8px;background:#E3E6EE;border-radius:5px;overflow:hidden;margin:6px 0 14px}
.prog i{display:block;height:100%;background:var(--carga)}
.prog.full i{background:var(--ok)}
/* tables */
table{width:100%;border-collapse:collapse}
th{font-size:12px;font-weight:600;color:var(--sec);text-align:left;padding:8px 10px;border-bottom:1px solid var(--borde);white-space:nowrap}
td{padding:11px 10px;border-bottom:1px solid #EEF0F4;vertical-align:middle}
tr:last-child td{border-bottom:0}
.mini{display:inline-block;width:70px;height:6px;background:#E3E6EE;border-radius:4px;vertical-align:middle;margin-right:6px;overflow:hidden}
.mini i{display:block;height:100%;background:var(--carga)}
.mini.full i{background:var(--ok)}
/* tabs */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--borde);margin-bottom:14px}
.tabs button{background:none;border:0;border-bottom:3px solid transparent;padding:10px 16px;cursor:pointer;font-weight:600;color:var(--sec)}
.tabs button.on{color:var(--azul);border-bottom-color:var(--azul)}
.tabs .sp{flex:1}.tabs .role{align-self:center;font-size:12px;color:var(--sec)}
/* qr */
.steps{display:flex;gap:12px;margin-bottom:16px}
.step{flex:1;padding:12px 16px;border-radius:10px;background:#fff;border:1px solid var(--borde);font-weight:600;color:var(--sec)}
.step.done{color:var(--ok)}.step.act{color:var(--azul);border-color:var(--azul)}
.cam{background:#161B3A;border-radius:10px;height:260px;position:relative;display:flex;align-items:center;justify-content:center;color:#fff}
.cam .cl{position:absolute;top:10px;left:14px;font-size:12px;letter-spacing:.03em}
.cam .led{position:absolute;top:12px;right:14px;width:8px;height:8px;border-radius:50%;background:#3DDC84}
.cam .cap2{position:absolute;bottom:10px;width:100%;text-align:center;font-size:12px}
.cam .fr{position:absolute;width:150px;height:150px;border:0}
.cam .fr i{position:absolute;width:26px;height:26px;border:3px solid var(--amarillo)}
.cam .fr i:nth-child(1){top:0;left:0;border-right:0;border-bottom:0}.cam .fr i:nth-child(2){top:0;right:0;border-left:0;border-bottom:0}.cam .fr i:nth-child(3){bottom:0;left:0;border-right:0;border-top:0}.cam .fr i:nth-child(4){bottom:0;right:0;border-left:0;border-top:0}
.qrbox{background:#fff;padding:8px;border-radius:6px;width:104px;height:104px}
.timer{display:flex;justify-content:space-between;align-items:center;border-radius:8px;padding:11px 14px;background:var(--fondo);margin:14px 0}
.timer.ok{background:var(--ok-bg);color:var(--ok)}
.timer.late{background:var(--asig-bg);color:var(--asig);font-weight:700}
/* modal & toast */
.ov{position:fixed;inset:0;background:rgba(20,24,50,.5);display:flex;align-items:center;justify-content:center;z-index:50}
.modal{background:#fff;border-radius:14px;padding:24px;width:440px;max-width:92vw;max-height:90vh;overflow:auto;box-shadow:0 20px 50px rgba(0,0,0,.3)}
.modal h2{font-size:18px;margin-bottom:6px}
.modal .acts{display:flex;justify-content:space-between;gap:10px;margin-top:20px}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--texto);color:#fff;padding:12px 18px;border-radius:10px;z-index:80;max-width:520px;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.toast.err{background:#8E2630}
.drop{border:2px dashed #B5BACB;border-radius:10px;padding:22px;text-align:center;background:#FAFBFC;cursor:pointer}
.drop:hover{background:#F1F3F9}
.drop.err{border-color:var(--bloq);background:var(--bloq-bg)}
.drop.okf{border-color:var(--ok);background:var(--ok-bg);border-style:solid}
.thumb{max-width:100%;max-height:150px;border-radius:6px;display:block;margin:8px auto 0}
.hint{font-size:12px;color:var(--sec)}
.tag-priv{display:flex;gap:8px;align-items:center}
/* login */
.loginwrap{min-height:calc(100vh - 56px);display:flex;align-items:center;justify-content:center;background:var(--fondo)}
.loginwrap .card{width:380px;padding:30px}
.loginwrap h1{font-size:24px;margin-bottom:14px}
.demo{margin-top:16px;font-size:12px;color:var(--sec);background:var(--fondo);border-radius:8px;padding:10px}
.demo button{background:none;border:0;color:var(--azul);font-weight:600;cursor:pointer;padding:2px 0;text-decoration:underline}
.offline{background:var(--asig-bg);color:var(--asig);text-align:center;padding:8px;font-weight:600}
.empty{text-align:center;padding:26px;color:var(--sec)}
.rolesum{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:14px}
.rolesum div{font-size:12px;color:var(--sec)}.rolesum b{display:block;font-size:13px;color:var(--texto);margin-bottom:2px}
.sr{position:absolute;left:-9999px}
</style>
</head>
<body>
<div id="app"></div>
<script>
"use strict";
/* ===================== ESTADO ===================== */
const HOY="10 nov 2026", TURNO="Turno matutino";
const ROLES={admin:"Administrador",oper:"Operador",audit:"Auditor"};
const CUENTAS={admin:{p:"admin123",rol:"admin",n:"M. García"},operador:{p:"oper123",rol:"oper",n:"L. Ramírez"},auditor:{p:"audit123",rol:"audit",n:"R. Mendoza"}};
const PERMISOS={ // rutas por rol
  admin:["tablero","qr","oleadas","devoluciones","bitacora","detalle"],
  oper:["tablero","qr","oleadas","devoluciones","detalle"],
  audit:["tablero","bitacora","detalle"]
};
const NAV=[["tablero","Tablero de Patio","grid"],["qr","Asignación QR","qr"],["oleadas","Oleadas de Salida","truck"],["devoluciones","Devoluciones","undo"],["bitacora","Bitácora y Usuarios","shield"]];
const ICONS={grid:'<rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/>',
qr:'<rect x="3" y="3" width="6" height="6"/><rect x="15" y="3" width="6" height="6"/><rect x="3" y="15" width="6" height="6"/><path d="M15 15h2v2h-2zM19 19h2v2h-2zM15 20v1M21 15v2"/>',
truck:'<path d="M2 6h11v10H2zM13 9h5l3 3v4h-8z"/><circle cx="6" cy="18" r="2"/><circle cx="17" cy="18" r="2"/>',
undo:'<path d="M9 14L4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/>',
shield:'<path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/><path d="M9 12l2 2 4-4"/>',
help:'<circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.7.4-1 .9-1 1.7M12 17h.01"/>',
bell:'<path d="M6 8a6 6 0 0 1 12 0c0 7 3 8 3 8H3s3-1 3-8M10 20a2 2 0 0 0 4 0"/>'};
const ico=n=>`<svg class="ico" viewBox="0 0 24 24" aria-hidden="true">${ICONS[n]}</svg>`;

const ZONAS=[["A · ACCESO NORTE","A",1,6],["A · ANDÉN DE CARGA","A",7,12],["B · ACCESO NORTE","B",1,6],["B · ANDÉN DE CARGA","B",7,12]];
const INIT_BAYS={A01:"carga",A02:"carga",A03:"asig",A04:"disp",A05:"disp",A06:"bloq",A07:"carga",A08:"asig",A09:"disp",A10:"carga",A11:"disp",A12:"asig",B01:"carga",B02:"disp",B03:"carga",B04:"asig",B05:"disp",B06:"carga",B07:"bloq",B08:"disp",B09:"asig",B10:"carga",B11:"carga",B12:"disp"};
const S={
  sesion:null, offline:false,
  bays:Object.fromEntries(Object.entries(INIT_BAYS).map(([k,v])=>[k,{e:v}])),
  sel:"A02", filtro:null, busca:"",
  oleadas:[
    {id:"OL-104",hora:"10:30",cap:20,uso:18,estado:"En carga",ruta:"Norte"},
    {id:"OL-105",hora:"11:00",cap:20,uso:12,estado:"En carga",ruta:"Centro"},
    {id:"OL-106",hora:"11:30",cap:20,uso:8,estado:"Programada",ruta:"Sur"},
    {id:"OL-107",hora:"12:00",cap:16,uso:0,estado:"Programada",ruta:"Norte"},
    {id:"OL-102",hora:"09:30",cap:20,uso:20,estado:"Despachada",ruta:"Centro"},
    {id:"OL-103",hora:"10:00",cap:16,uso:16,estado:"Despachada",ruta:"Sur"}],
  devs:[
    {g:"MLM-9842-7710-0358",d:"A*** L***",m:"Domicilio no localizado",h:"10:18",e:"Registrada"},
    {g:"MLM-9842-7710-0349",d:"R*** M***",m:"Destinatario ausente",h:"10:06",e:"Registrada"},
    {g:"MLM-9842-7710-0332",d:"C*** R***",m:"Paquete dañado",h:"09:54",e:"Registrada"},
    {g:"MLM-9842-7710-0318",d:"L*** P***",m:"Rechazado por destinatario",h:"09:41",e:"Registrada"},
    {g:"MLM-9842-7710-0306",d:"E*** G***",m:"Dirección incompleta",h:"09:28",e:"Registrada"}],
  usuarios:[["M*** G***","Administrador","Activo"],["L*** R***","Operador","Activo"],["S*** P***","Operador","Activo"],["R*** M***","Auditor","Activo"],["A*** L***","Operador","Activo"],["C*** R***","Auditor","Inactivo"],["E*** G***","Operador","Activo"],["D*** S***","Operador","Activo"],["F*** T***","Auditor","Activo"],["J*** D***","Operador","Activo"],["P*** N***","Administrador","Activo"],["V*** C***","Operador","Activo"]].map(([n,r,e],i)=>({id:i+1,n,r,e})),
  log:[
    {u:"M*** G***",r:"Admin",a:"Asignó cajón",rec:"B04 · ML-036",ip:"10.24.***.18",t:"10:24",res:"Permitido",mot:"—"},
    {u:"L*** R***",r:"Operador",a:"Creó oleada",rec:"OL-107",ip:"10.24.***.42",t:"10:21",res:"Permitido",mot:"—"},
    {u:"S*** P***",r:"Operador",a:"Registró devolución",rec:"Guía ***0358",ip:"10.24.***.31",t:"10:18",res:"Permitido",mot:"—"},
    {u:"M*** G***",r:"Admin",a:"Cambió rol",rec:"Usuario L*** R***",ip:"10.24.***.18",t:"10:12",res:"Permitido",mot:"—"},
    {u:"R*** M***",r:"Auditor",a:"Intentó editar usuario",rec:"Usuario L*** R***",ip:"10.24.***.42",t:"10:09",res:"Denegado",mot:"Permisos insuficientes"}],
  movs:["10:24 · B04 asignado a ML-036","10:22 · A05 liberado","10:18 · Devolución de guía ***0358 registrada"],
  qr:{fase:0,codigo:"",t0:0,tick:null,unidad:null,cajon:"",err:"",conflicto:false,ok:null},
  tab:"usuarios", fAccion:"", fBusca:"", fFecha:"2026-11-10",
  panelOleada:null, devForm:{g:"",m:"",n:"",file:null,fileErr:"",url:""},
  notifs:1
};
const hhmm=()=>{const d=new Date();return String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0")};
const rolCorto=()=>({admin:"Admin",oper:"Operador",audit:"Auditor"}[S.sesion.rol]);
const maskNombre=n=>n.split(" ").map(w=>w[0]+"***").join(" ");
function logEv(a,rec,res="Permitido",mot="—"){
  S.log.unshift({u:maskNombre(S.sesion.n),r:rolCorto(),a,rec,ip:"10.24.***.18",t:hhmm(),res,mot});
}
function mov(txt){S.movs.unshift(hhmm()+" · "+txt);S.movs=S.movs.slice(0,6)}
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const $=s=>document.querySelector(s);
const ESTADO_TXT={disp:"Disponible",carga:"En carga",asig:"Asignado",bloq:"Bloqueado"};
const cnt=()=>{const c={disp:0,carga:0,asig:0,bloq:0};Object.values(S.bays).forEach(b=>c[b.e]++);return c};

/* ===================== UI BASE ===================== */
function toast(msg,err){const t=document.createElement("div");t.className="toast"+(err?" err":"");t.setAttribute("role","status");t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),3200)}
function modal(html){closeModal();const o=document.createElement("div");o.className="ov";o.id="ov";o.innerHTML=`<div class="modal" role="dialog" aria-modal="true">${html}</div>`;o.addEventListener("click",e=>{if(e.target===o)closeModal()});document.body.appendChild(o);const f=o.querySelector("input,select,button");f&&f.focus()}
function closeModal(){const o=$("#ov");o&&o.remove()}
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeModal()});
function confirmar(titulo,texto,si,fn,volver="Volver"){

/* ===================== ASIGNACIÓN QR ===================== */
function stopTick(){if(S.qr.tick){clearInterval(S.qr.tick);S.qr.tick=null}}
function qrSvg(seed){let s="",r=seed;const rnd=()=>{r=(r*9301+49297)%233280;return r/233280};
  for(let y=0;y<21;y++)for(let x=0;x<21;x++){const f=(x<7&&y<7)||(x>13&&y<7)||(x<7&&y>13);let on=rnd()>.5;
    if(f){const ex=x<7?x:x-14,ey=y<7?y:y-14;on=ex===0||ex===6||ey===0||ey===6||(ex>=2&&ex<=4&&ey>=2&&ey<=4)}
    if(on)s+=`<rect x="${x}" y="${y}" width="1" height="1"/>`}
  return `<svg viewBox="0 0 21 21" width="88" height="88" fill="#161B3A" shape-rendering="crispEdges" aria-label="Código QR">${s}</svg>`}
function vQR(){
  const q=S.qr,f=q.fase;
  const disp=Object.entries(S.bays).filter(([k,b])=>b.e==="disp").map(([k])=>k);
  const stepc=i=>f>i?"done":f===i?"act":"";
  const lec=f>=1&&!q.err;
  const cam=`<div class="cam"><div class="cl">CÁMARA 01 · ACCESO PRINCIPAL</div><div class="led" aria-hidden="true"></div><div class="fr" aria-hidden="true"><i></i><i></i><i></i><i></i></div><div class="qrbox">${qrSvg(q.err?7:42)}</div><div class="cap2">${q.err?"QR no válido o vencido":lec?"QR detectado · Validación completada":"Acerca el QR del chofer al área de lectura"}</div></div>`;
  const izq=`<div class="card"><h2>Escaneo de acceso</h2><p class="sm" style="margin:2px 0 12px">Acerca el QR del chofer al área de lectura.</p>${cam}
   <div style="display:flex;gap:10px;margin-top:14px;align-items:end"><div style="flex:1"><label for="qc" style="margin-top:0">Código QR (ingreso manual)</label><input id="qc" type="text" placeholder="ML-QR-009842" value="${esc(q.codigo)}" class="${q.err?"err":""}"></div><button class="btn" id="manual">Validar código</button></div>
   <div style="margin-top:10px;display:flex;gap:14px"><button class="linkb" id="simula">Simular escaneo</button><button class="linkb" id="simulaMal">Simular QR vencido</button></div></div>`;
  let der;
  if(q.ok){der=`<div class="card"><div class="banner ok" role="status"><div><b>Cajón ${q.ok.k} asignado a ${esc(q.ok.u)}.</b><br>Quedó registrado en la bitácora.</div></div><button class="btn pri full" id="irT">Ver en el tablero</button><button class="btn full" style="margin-top:10px" id="otra">Asignar otra unidad</button></div>`}
  else if(f<1){der=`<div class="card"><h2>Unidad validada</h2><div class="empty">Escanea un QR para ver los datos de la unidad.</div></div>`}
  else if(q.err){der=`<div class="card"><h2>No se pudo validar el acceso</h2><p class="sm">No se asignó ningún cajón. Inténtalo nuevamente.</p><button class="btn pri full" style="margin-top:14px" id="reesc">Volver a escanear</button><p style="margin-top:12px"><span class="sm">¿El QR no funciona? Usa «Código QR (ingreso manual)».</span></p></div>`}
  else{der=`<div class="card"><div style="display:flex;justify-content:space-between;align-items:center"><h2>Unidad validada</h2><span class="pill p-ok">✓ Acceso vigente</span></div>
   <dl class="kv" style="border:0;padding-top:0"><dt>Chofer</dt><dd>${q.unidad.ch}</dd><dt>Unidad / Placa</dt><dd>${q.unidad.u} / ***-${q.unidad.pl}</dd><dt>Transportista</dt><dd>${q.unidad.tr}</dd><dt>Registro de acceso</dt><dd>${q.unidad.hr}</dd></dl>
   <div style="border-top:1px solid var(--borde);padding-top:10px"><label for="cj" style="margin-top:0">Cajón disponible</label><select id="cj" class="${q.cjErr?"err":""}">${disp.length?disp.map(k=>`<option ${q.cajon===k?"selected":""}>${k}</option>`).join(""):"<option value=''>Sin cajones disponibles</option>"}</select><div class="hint" style="margin-top:4px">${disp.length} cajones libres · Actualizado en tiempo real</div>${q.cjErr?`<div class="banner err" style="margin-top:10px" role="alert"><div><b>Cajón ocupado.</b> ${q.cjErr}</div></div>`:""}</div>
   <div class="timer" id="timer"><span>Tiempo desde lectura</span><b id="tval">00:00.0 / 5 s</b></div>
   <button class="btn pri full" id="asig" ${disp.length?"":"disabled"}>Asignar Cajón (&lt;5s)</button><p class="sm" style="margin-top:8px">La asignación se registra automáticamente en la bitácora. <button class="linkb" id="conf" style="font-size:12px">Simular cajón ocupado (demo)</button></p></div>`}
  return `<h1>Asignación QR</h1><p class="sub">Del acceso al cajón en menos de 5 segundos.</p>
  <div class="steps" role="list"><div class="step ${stepc(0)}" role="listitem">01 · Escanear QR</div><div class="step ${stepc(1)}" role="listitem">02 · Validar unidad</div><div class="step ${stepc(2)||(q.ok?"done":"")}" role="listitem">03 · Asignar cajón</div></div>
  <div class="row"><div class="col">${izq}</div><div class="col">${der}</div></div>`;
}
const UNIDADES=[{ch:"J*** D***",u:"ML-042",pl:"482",tr:"Transportes del Centro"},{ch:"R*** T***",u:"ML-051",pl:"907",tr:"Logística Anáhuac"},{ch:"A*** P***",u:"ML-036",pl:"315",tr:"Fletes Tepotzotlán"}];
function iniciarLectura(codigo){
  const q=S.qr;q.codigo=codigo;q.err="";q.cjErr="";q.conflicto=false;q.ok=null;
  const u={...UNIDADES[Math.floor(Math.random()*UNIDADES.length)],hr:new Date().toTimeString().slice(0,8)+" h"};
  q.unidad=u;q.fase=1;q.t0=Date.now();q.cajon="";
  stopTick();q.tick=setInterval(updTimer,100);render();
}
function updTimer(){
  const el=$("#tval");if(!el){return}
  const s=(Date.now()-S.qr.t0)/1000,box=$("#timer");
  const mm=String(Math.floor(s/60)).padStart(2,"0"),ss=(s%60).toFixed(1).padStart(4,"0");
  if(s>5){el.textContent=`${mm}:${ss} · Superó los 5 s`;box.className="timer late"}
  else{el.textContent=`${mm}:${ss} / 5 s`;box.className="timer ok"}
}
function bQR(){
  const q=S.qr;
  $("#manual").onclick=()=>{const v=$("#qc").value.trim().toUpperCase();
    if(!/^ML-QR-\d{6}$/.test(v)){q.codigo=v;q.err="El código no tiene el formato ML-QR-000000.";q.fase=1;stopTick();render();return}
    iniciarLectura(v)};
  $("#qc").onkeydown=e=>{if(e.key==="Enter"){e.preventDefault();$("#manual").click()}};
  $("#simula").onclick=()=>iniciarLectura("ML-QR-"+String(Math.floor(100000+Math.random()*899999)));
  $("#simulaMal").onclick=()=>{q.codigo="ML-QR-000000";q.err="vencido";q.fase=1;stopTick();render()};
  const re=$("#reesc");re&&(re.onclick=()=>{q.fase=0;q.err="";q.codigo="";render()});
  const cj=$("#cj");cj&&(cj.onchange=()=>{q.cajon=cj.value;q.cjErr=""});
  const cf=$("#conf");cf&&(cf.onclick=()=>{q.conflicto=true;toast("Demo: el siguiente intento fallará por cajón ocupado.")});
  const a=$("#asig");a&&(a.onclick=()=>{
    const k=$("#cj").value;if(!k)return;
    if(q.conflicto||S.bays[k].e!=="disp"){q.conflicto=false;
      const otros=Object.entries(S.bays).filter(([x,b])=>b.e==="disp"&&x!==k).map(([x])=>x);
      q.cjErr=`El cajón ${k} acaba de ser tomado por otro operador. ${otros.length?"Elige el "+otros[0]+" u otro disponible.":"No hay más cajones libres."}`;
      if(S.bays[k].e==="disp"){S.bays[k].e="asig"}
      logEv("Intentó asignar cajón",k,"Denegado","Cajón ocupado");render();return}
    const s=((Date.now()-q.t0)/1000).toFixed(1);stopTick();
    S.bays[k]={e:"asig",unidad:q.unidad.u+" · Rabón"};
    logEv("Asignó cajón",k+" · "+q.unidad.u);mov(k+" asignado a "+q.unidad.u);
